[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-risk-scoring-case-study"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "tzdata==2026.5",
]

[tool.setuptools]
py-modules = ["utils"]
